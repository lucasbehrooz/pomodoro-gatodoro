name: Build Windows

# Gera Pomodoro.exe em uma máquina Windows.
# - Em push de tag v* (ex.: v0.0.1): gera o .exe e publica uma GitHub Release com ele.
# - Manualmente (workflow_dispatch): gera o .exe e disponibiliza como artefato da execução.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pyinstaller

      - name: Testes
        run: python -m pytest -q

      - name: Gerar executável
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed
          --name Pomodoro
          --icon assets/gato.ico
          --paths src
          --collect-all customtkinter
          --add-data "assets;assets"
          packaging/run_pomodoro.py

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Gerar instalador
        shell: pwsh
        env:
          # Em push de tag, github.ref_name é ex.: v0.0.3 -> 0.0.3. Manual: 0.0.0-dev.
          APP_VERSION: ${{ github.event_name == 'push' && github.ref_name || '0.0.0-dev' }}
        run: |
          $v = $env:APP_VERSION -replace '^v', ''
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe não encontrado em $iscc" }
          & $iscc "/DMyAppVersion=$v" packaging\pomodoro.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou (código $LASTEXITCODE)" }

      - name: Enviar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Pomodoro-windows
          path: |
            dist/Pomodoro.exe
            dist/Pomodoro-Setup-*.exe

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Pomodoro.exe
            dist/Pomodoro-Setup-*.exe
          generate_release_notes: true
