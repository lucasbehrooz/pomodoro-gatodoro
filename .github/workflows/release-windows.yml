name: Build Windows

# Gera PomodoroGatodoro.exe em uma máquina Windows.
# - Em push de tag v* (ex.: v0.0.1): gera o .exe e publica uma GitHub Release com ele.
# - Manualmente (workflow_dispatch): gera o .exe e disponibiliza como artefato da execução.
# - Em push na main ou em pull request que mexa em código/empacotamento: só valida
#   o build (testes, .exe e instalador como artefato, sem release).

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "src/**"
      - "docs/packaging/**"
      - "pyproject.toml"
      - ".github/workflows/release-windows.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "docs/packaging/**"
      - "pyproject.toml"
      - ".kiro/**"
      - ".github/workflows/release-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pyinstaller

      - name: Testes
        run: python -m pytest -q

      # O aviso de nova versão compara a tag da release com __version__.
      # Se não baterem, o app instalado se acharia desatualizado para sempre.
      - name: Conferir versão da tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          APP=$(python -c "import pomodoro; print(pomodoro.__version__)")
          PROJ=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$APP" != "$GITHUB_REF_NAME" ] || [ "v$PROJ" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME não bate: __init__.py=$APP, pyproject.toml=$PROJ"
            exit 1
          fi

      - name: Gerar executável
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed
          --name PomodoroGatodoro
          --icon assets/gato.ico
          --paths src
          --collect-all customtkinter
          --collect-all pystray
          --collect-all PIL
          --collect-all numpy
          --collect-binaries sounddevice
          --hidden-import=winotify
          --hidden-import=numpy
          --add-data "assets;assets"
          docs/packaging/run_pomodoro.py

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Gerar instalador
        shell: pwsh
        env:
          # Em push de tag, github.ref_name é ex.: v0.0.3 -> 0.0.3. Main/manual: 0.0.0-dev.
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0-dev' }}
        run: |
          $v = $env:APP_VERSION -replace '^v', ''
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe não encontrado em $iscc" }
          & $iscc "/DMyAppVersion=$v" docs\packaging\pomodoro.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou (código $LASTEXITCODE)" }

      - name: Enviar artefato
        uses: actions/upload-artifact@v7
        with:
          name: PomodoroGatodoro-windows
          path: |
            dist/pomodoro-gatodoro-x64-setup.exe

      - name: Gerar notas da release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # --output grava em UTF-8; "> arquivo" no Windows sairia em cp1252 (acentos quebrados).
          python tools/extract_changelog.py "$VERSION" --output release-notes.md
          echo "--- notas da release:"
          cat release-notes.md

      - name: Gerar latest.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          # Lido pelo app para verificar/baixar atualizações sem usar a API do GitHub.
          python tools/make_latest_json.py "${GITHUB_REF_NAME#v}" dist/pomodoro-gatodoro-x64-setup.exe --output dist/latest.json
          cat dist/latest.json

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/PomodoroGatodoro.exe
            dist/pomodoro-gatodoro-x64-setup.exe
            dist/latest.json
          body_path: release-notes.md
