name: Relatar um problema
description: Algo não funciona como deveria no Pomodoro Gatodoro.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por relatar. Preencha as informações abaixo para facilitar a correção.
  - type: input
    id: versao
    attributes:
      label: Versão do app
      description: "Está na página da release (ex.: 0.0.7)."
      placeholder: "0.0.7"
    validations:
      required: true
  - type: dropdown
    id: instalacao
    attributes:
      label: Como você instalou
      options:
        - Instalador (pomodoro-gatodoro-x64-setup.exe)
        - Executável (PomodoroGatodoro.exe)
        - Código-fonte (Python)
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Versão do Windows
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Abrir o app
        2. Clicar em ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que deveria acontecer
    validations:
      required: true
  - type: textarea
    id: ocorreu
    attributes:
      label: O que aconteceu
      description: Descreva o comportamento observado. Se houver mensagem de erro, cole aqui.
    validations:
      required: true
  - type: textarea
    id: anexos
    attributes:
      label: Capturas de tela (opcional)
      description: Arraste a imagem para este campo.
